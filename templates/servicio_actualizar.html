{% extends 'base.html' %}

{% block title %}Actualizar Servicio - Sistema de Gestión de Salud{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-pencil-square"></i> Actualizar Servicio</h1>
            <a href="{% url 'servicio_listar' %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Información del Paciente y Prestadora -->
                    <h5 class="border-bottom pb-2 mb-3">Información General</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Paciente *</label>
                            <select name="id_paciente" class="form-select" required>
                                {% for paciente in pacientes %}
                                <option value="{{ paciente.id_paciente }}" {% if paciente.id_paciente == servicio.id_paciente.id_paciente %}selected{% endif %}>
                                    {{ paciente.primer_nombre }} {{ paciente.primer_apellido }} - {{ paciente.numero_documento }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prestadora de Salud *</label>
                            <select name="id_prestadora" class="form-select" required>
                                {% for prestadora in prestadoras %}
                                <option value="{{ prestadora.id_prestadora }}" {% if prestadora.id_prestadora == servicio.id_prestadora.id_prestadora %}selected{% endif %}>
                                    {{ prestadora.nombre_prestadora }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Información del Servicio -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Detalles del Servicio</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Tipo de Servicio *</label>
                            <input type="text" name="tipo_servicio" class="form-control" value="{{ servicio.tipo_servicio }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado de la Consulta *</label>
                            <select name="estado_consulta" class="form-select" required>
                                <option value="PROGRAMADA" {% if servicio.estado_consulta == 'PROGRAMADA' %}selected{% endif %}>Programada</option>
                                <option value="ATENDIDA" {% if servicio.estado_consulta == 'ATENDIDA' %}selected{% endif %}>Atendida</option>
                                <option value="CANCELADA" {% if servicio.estado_consulta == 'CANCELADA' %}selected{% endif %}>Cancelada</option>
                                <option value="NO_ASISTIO" {% if servicio.estado_consulta == 'NO_ASISTIO' %}selected{% endif %}>No asistió</option>
                            </select>
                        </div>
                    </div>

                    <!-- Información Clínica -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Información Clínica</h5>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Motivo/Causa *</label>
                            <select name="codigo_motivo" class="form-select" required>
                                {% for motivo in motivos %}
                                <option value="{{ motivo.codigo_motivo }}" {% if motivo.codigo_motivo == servicio.codigo_motivo.codigo_motivo %}selected{% endif %}>
                                    {{ motivo.get_nombre_motivo_display }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Vía de Ingreso *</label>
                            <select name="codigo_ingreso" class="form-select" required>
                                {% for via in vias_ingreso %}
                                <option value="{{ via.codigo_ingreso }}" {% if via.codigo_ingreso == servicio.codigo_ingreso.codigo_ingreso %}selected{% endif %}>
                                    {{ via.get_nombre_ingreso_display }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Modalidad *</label>
                            <select name="modalidad_id" class="form-select" required>
                                {% for modalidad in modalidades %}
                                <option value="{{ modalidad.modalidad_id }}" {% if modalidad.modalidad_id == servicio.modalidad_id.modalidad_id %}selected{% endif %}>
                                    {{ modalidad.grupo_servicio }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Diagnóstico CIE-10 *</label>
                            <select name="cie_id" class="form-select" required>
                                {% for diagnostico in diagnosticos %}
                                <option value="{{ diagnostico.cie_id }}" {% if diagnostico.cie_id == servicio.cie_id.cie_id %}selected{% endif %}>
                                    {{ diagnostico.tipo }} - {{ diagnostico.nombre }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Diagnóstico (Descripción) *</label>
                            <textarea name="diagnostico" class="form-control" rows="3" required>{{ servicio.diagnostico }}</textarea>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Diagnóstico de Egreso</label>
                            <textarea name="diagnostico_egreso" class="form-control" rows="2">{{ servicio.diagnostico_egreso|default:'' }}</textarea>
                        </div>
                    </div>

                    <!-- Fechas -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Fechas</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha y Hora de Ingreso *</label>
                            <input type="datetime-local" name="fecha_ingreso" class="form-control" value="{{ servicio.fecha_ingreso|date:'Y-m-d\TH:i' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha y Hora de Egreso</label>
                            <input type="datetime-local" name="fecha_egreso" class="form-control" value="{% if servicio.fecha_egreso %}{{ servicio.fecha_egreso|date:'Y-m-d\TH:i' }}{% endif %}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'servicio_listar' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save"></i> Actualizar Servicio
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
