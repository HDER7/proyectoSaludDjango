{% extends 'base.html' %}

{% block title %}Crear Servicio - Sistema de Gestión de Salud{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-plus-circle"></i> Registrar Nuevo Servicio</h1>
            <a href="{% url 'servicio_listar' %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Información del Paciente y Prestadora -->
                    <h5 class="border-bottom pb-2 mb-3">Información General</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Paciente *</label>
                            <select name="id_paciente" class="form-select" required>
                                <option value="">Seleccione un paciente...</option>
                                {% for paciente in pacientes %}
                                <option value="{{ paciente.id_paciente }}">
                                    {{ paciente.primer_nombre }} {{ paciente.primer_apellido }} - {{ paciente.numero_documento }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prestadora de Salud *</label>
                            <select name="id_prestadora" class="form-select" required>
                                <option value="">Seleccione una prestadora...</option>
                                {% for prestadora in prestadoras %}
                                <option value="{{ prestadora.id_prestadora }}">{{ prestadora.nombre_prestadora }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Información del Servicio -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Detalles del Servicio</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Tipo de Servicio *</label>
                            <input type="text" name="tipo_servicio" class="form-control" placeholder="Ej: Consulta General, Urgencias, etc." required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado de la Consulta *</label>
                            <select name="estado_consulta" class="form-select" required>
                                <option value="PROGRAMADA">Programada</option>
                                <option value="ATENDIDA">Atendida</option>
                                <option value="CANCELADA">Cancelada</option>
                                <option value="NO_ASISTIO">No asistió</option>
                            </select>
                        </div>
                    </div>

                    <!-- Información Clínica -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Información Clínica</h5>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Motivo/Causa *</label>
                            <select name="codigo_motivo" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for motivo in motivos %}
                                <option value="{{ motivo.codigo_motivo }}">{{ motivo.get_nombre_motivo_display }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Vía de Ingreso *</label>
                            <select name="codigo_ingreso" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for via in vias_ingreso %}
                                <option value="{{ via.codigo_ingreso }}">{{ via.get_nombre_ingreso_display }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Modalidad *</label>
                            <select name="modalidad_id" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for modalidad in modalidades %}
                                <option value="{{ modalidad.modalidad_id }}">{{ modalidad.grupo_servicio }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Diagnóstico CIE-10 *</label>
                            <select name="cie_id" class="form-select" required>
                                <option value="">Seleccione un diagnóstico...</option>
                                {% for diagnostico in diagnosticos %}
                                <option value="{{ diagnostico.cie_id }}">{{ diagnostico.tipo }} - {{ diagnostico.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Diagnóstico (Descripción) *</label>
                            <textarea name="diagnostico" class="form-control" rows="3" placeholder="Descripción detallada del diagnóstico..." required></textarea>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Diagnóstico de Egreso</label>
                            <textarea name="diagnostico_egreso" class="form-control" rows="2" placeholder="Diagnóstico al momento del egreso (opcional)"></textarea>
                        </div>
                    </div>

                    <!-- Fechas -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Fechas</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha y Hora de Ingreso *</label>
                            <input type="datetime-local" name="fecha_ingreso" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha y Hora de Egreso</label>
                            <input type="datetime-local" name="fecha_egreso" class="form-control">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'servicio_listar' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save"></i> Guardar Servicio
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
