{% extends 'base.html' %}

{% block title %}Crear Paciente - Sistema de Gestión de Salud{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-person-plus"></i> Registrar Nuevo Paciente</h1>
            <a href="{% url 'paciente_listar' %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Datos de Identificación -->
                    <h5 class="border-bottom pb-2 mb-3">Datos de Identificación</h5>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Tipo de Documento *</label>
                            <select name="tipo_documento" class="form-select" required>
                                <option value="">Seleccione...</option>
                                <option value="CC">Cédula de Ciudadanía</option>
                                <option value="TI">Tarjeta de Identidad</option>
                                <option value="CE">Cédula de Extranjería</option>
                                <option value="PA">Pasaporte</option>
                                <option value="RC">Registro Civil</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Número de Documento *</label>
                            <input type="text" name="numero_documento" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Edad *</label>
                            <input type="number" name="edad" class="form-control" min="0" max="150" required>
                        </div>
                    </div>

                    <!-- Datos Personales -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Datos Personales</h5>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Primer Nombre *</label>
                            <input type="text" name="primer_nombre" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Segundo Nombre</label>
                            <input type="text" name="segundo_nombre" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Primer Apellido *</label>
                            <input type="text" name="primer_apellido" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Segundo Apellido</label>
                            <input type="text" name="segundo_apellido" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Fecha de Nacimiento *</label>
                            <input type="date" name="fecha_nacimiento" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sexo Biológico *</label>
                            <select name="sexo_biologico" class="form-select" required>
                                <option value="">Seleccione...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="I">Intersexual</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Identidad de Género</label>
                            <input type="text" name="identidad_genero" class="form-control">
                        </div>
                    </div>

                    <!-- Datos de Ubicación y Origen -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Ubicación y Origen</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">País *</label>
                            <select name="id_paciente_pais" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for pais in paises %}
                                <option value="{{ pais.id_pais }}">{{ pais.pais_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ciudad/Municipio *</label>
                            <select name="codigo_municipio" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for ciudad in ciudades %}
                                <option value="{{ ciudad.codigo_municipio }}">{{ ciudad.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Nacionalidad *</label>
                            <select name="id_nacionalidad" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for pais in paises %}
                                <option value="{{ pais.id_pais }}">{{ pais.pais_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Etnia *</label>
                            <select name="id_etnia" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for etnia in etnias %}
                                <option value="{{ etnia.id_etnia }}">{{ etnia.etnia }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Comunidad Étnica *</label>
                            <select name="id_comunidad" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for comunidad in comunidades %}
                                <option value="{{ comunidad.id_comunidad }}">{{ comunidad.comunidad }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Datos Laborales y de Salud -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">Datos Laborales y de Salud</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Ocupación (CIUO) *</label>
                            <select name="codigo_CIUO" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for ocupacion in ocupaciones %}
                                <option value="{{ ocupacion.codigo_CIUO }}">{{ ocupacion.nombre_ocupacion }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prestadora de Salud *</label>
                            <select name="id_prestadora" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for prestadora in prestadoras %}
                                <option value="{{ prestadora.id_prestadora }}">{{ prestadora.nombre_prestadora }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'paciente_listar' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar Paciente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
